<!--HEAD_START--><!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD_END-->
<title>Kizzo Film Explicatif</title>
<meta name="description" content="Kizzo — film explicatif 3D (1080×1920, 60 fps) : le parent scanne les leçons, l'enfant gagne son temps d'écran en apprenant.">
<style>
/* Plan : un seul monde sombre (navy Kizzo), scène 9:16 centrée, lecteur discret.
   Charte : Outfit (titres) / Inter (texte), orange #F97316, navy #0F172A, cyan logo #3DB5DA, radius 20px. */
/*FONTS*/
:root {
  --navy: #0F172A;
  --ink: #05080F;
  --orange: #F97316;
  --orange-2: #FF9D5C;
  --cyan: #3DB5DA;
  --mist: #E2E8F0;
  --slate: #94A3B8;
  --radius: 20px;
  --f-display: Outfit, "Plus Jakarta Sans", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--mist); font-family: var(--f-body); overflow: hidden; }
body { display: grid; place-items: center; }
#stage {
  --u: 4px;
  position: relative;
  overflow: hidden;
  background: #05080F;
  border-radius: 0;
  box-shadow: 0 30px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- Typographie cinétique */
#titles { position: absolute; inset: 0; pointer-events: none; perspective: calc(var(--u) * 140); }
.title {
  position: absolute; left: 50%; top: 9.5%;
  width: 92%;
  text-align: center;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: calc(var(--u) * 9.2);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: #fff;
  visibility: hidden;
  transform-origin: 50% 0;
  text-wrap: balance;
}
.title { isolation: isolate; }
.title .scrim {
  position: absolute; left: 50%; top: 50%; z-index: -1;
  width: 125%; height: 210%;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(3, 7, 18, 0.5), rgba(3, 7, 18, 0.22) 55%, rgba(3, 7, 18, 0));
  pointer-events: none; opacity: 0;
}
.title .tl { display: block; }
.title .tl.accent { color: var(--orange); }
.title .tl.accent .tc { background: linear-gradient(180deg, #FFB27A 0%, #F97316 70%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: none; }
.tw { display: inline-block; white-space: nowrap; }
.tc { display: inline-block; will-change: transform, opacity, filter; transform-origin: 50% 100%; text-shadow: 0 calc(var(--u) * 0.4) calc(var(--u) * 2.5) rgba(2, 6, 23, 0.55); }
.title .tl.accent .tc { text-shadow: none; }

.burst {
  position: absolute; left: 50%; top: 60%;
  transform: translate(-50%, -50%);
  font-family: var(--f-display);
  font-weight: 800;
  font-size: calc(var(--u) * 6.2);
  letter-spacing: 0.14em;
  white-space: nowrap;
  color: #fff;
  visibility: hidden;
  text-shadow: 0 0 calc(var(--u) * 3) rgba(249, 115, 22, 0.55);
}
.burst .tc { text-shadow: 0 0 calc(var(--u) * 3) rgba(249, 115, 22, 0.6), 0 calc(var(--u) * 0.4) calc(var(--u) * 1.6) rgba(2, 6, 23, 0.6); }
.burst-bar {
  position: absolute; left: 50%; bottom: calc(var(--u) * -2.6);
  width: 62%; height: calc(var(--u) * 0.6);
  border-radius: 99px;
  background: linear-gradient(90deg, transparent, var(--orange) 20%, #FFD2A8 50%, var(--orange) 80%, transparent);
  transform: translateX(-50%) scaleX(0);
  box-shadow: 0 0 calc(var(--u) * 2.4) rgba(249, 115, 22, 0.8);
}

.sig { position: absolute; left: 50%; top: 74%; transform: translate(-50%, 0); text-align: center; visibility: hidden; width: 90%; }
.wordmark {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: calc(var(--u) * 17);
  line-height: 1;
  letter-spacing: -0.04em;
  background: linear-gradient(100deg, #fff 0%, #fff 38%, #BDEBFA 46%, #ffffff 50%, #FFD2A8 54%, #fff 62%, #fff 100%);
  background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  will-change: transform, filter, opacity;
}
.tagline {
  margin-top: calc(var(--u) * 2.6);
  font-family: "Plus Jakarta Sans", var(--f-body);
  font-weight: 500;
  font-size: calc(var(--u) * 4.3);
  letter-spacing: -0.005em;
  color: #CBD5E1;
}
.tagline .tg { display: inline-block; }
.tagline .tg.accent { color: var(--orange-2); font-weight: 600; }

/* ---------- Lecteur */
#start, #loader {
  position: absolute; inset: 0;
  display: grid; place-items: center; align-content: center; gap: calc(var(--u) * 4);
  background: radial-gradient(120% 70% at 50% 40%, rgba(15, 23, 42, 0.55), rgba(5, 8, 15, 0.92));
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  text-align: center; padding-inline: 16px;
  z-index: 5;
}
#loader { font-family: var(--f-display); font-size: calc(var(--u) * 4); color: var(--slate); }
#loader::before {
  content: ""; width: calc(var(--u) * 10); height: calc(var(--u) * 10); border-radius: 50%;
  border: calc(var(--u) * 0.8) solid rgba(255, 255, 255, 0.12); border-top-color: var(--orange);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.start-mark { width: calc(var(--u) * 26); height: auto; filter: drop-shadow(0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(61, 181, 218, 0.35)); }
.start-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: calc(var(--u) * 8); letter-spacing: -0.03em; color: #fff; line-height: 1; }
.start-sub { margin: 0; font-size: calc(var(--u) * 3.6); color: var(--slate); }
.btn-start {
  appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: calc(var(--u) * 2.2);
  padding: calc(var(--u) * 3.2) calc(var(--u) * 7);
  border-radius: 999px;
  background: linear-gradient(180deg, var(--orange-2), var(--orange));
  color: #fff; font-family: var(--f-display); font-weight: 700; font-size: calc(var(--u) * 4.6);
  box-shadow: 0 calc(var(--u) * 1.2) 0 #C2410C, 0 calc(var(--u) * 3) calc(var(--u) * 8) rgba(249, 115, 22, 0.45);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-start:hover { transform: translateY(-2px); }
.btn-start:active { transform: translateY(calc(var(--u) * 1)); box-shadow: 0 calc(var(--u) * 0.2) 0 #C2410C, 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(249, 115, 22, 0.4); }
.btn-start:focus-visible, .ctl:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.btn-start svg { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); }
.start-meta { margin: 0; font-size: calc(var(--u) * 2.9); color: #64748B; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; font-variant-numeric: tabular-nums; }

#controls {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  display: flex; align-items: center; gap: calc(var(--u) * 2.4);
  padding: calc(var(--u) * 10) calc(var(--u) * 4) calc(var(--u) * 4);
  padding-bottom: calc(var(--u) * 4 + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(5, 8, 15, 0.85), rgba(5, 8, 15, 0));
  opacity: 0; transition: opacity 0.35s ease;
}
#stage.ready:not(.playing) #controls, #stage.show-ui #controls, #controls:focus-within { opacity: 1; }
.ctl {
  appearance: none; border: 0; background: rgba(255, 255, 255, 0.1); color: #fff; cursor: pointer;
  width: calc(var(--u) * 9); height: calc(var(--u) * 9); min-width: 36px; min-height: 36px;
  border-radius: 50%; display: grid; place-items: center; flex: none;
}
.ctl:hover { background: rgba(255, 255, 255, 0.18); }
.ctl svg { width: 52%; height: 52%; }
#bar { position: relative; flex: 1; height: calc(var(--u) * 6); min-height: 24px; cursor: pointer; display: grid; align-items: center; touch-action: none; }
#bar::before { content: ""; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.18); }
#bar-fill { position: absolute; left: 0; right: 0; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--cyan), var(--orange)); transform-origin: 0 50%; transform: scaleX(0); }
#time { font-size: calc(var(--u) * 3); min-width: 9ch; text-align: right; color: var(--mist); font-variant-numeric: tabular-nums; font-weight: 600; }
.i-pause, #stage.playing .i-play { display: none; }
#stage.playing .i-pause { display: block; }
.i-off, #stage.muted .i-on { display: none; }
#stage.muted .i-off { display: block; }
#btn-replay { display: none; }
#stage.ended #btn-replay { display: grid; }

html.export #controls, html.export #start, html.export #loader { display: none !important; }
html.export #stage { box-shadow: none; }
@media (prefers-reduced-motion: reduce) { #loader::before { animation-duration: 3s; } }
/*FILM_CSS*/
</style>
<!--HEAD_CLOSE--></head>
<body>
<!--BODY_OPEN-->
<main id="stage" aria-label="Kizzo — film explicatif 3D">
  <canvas id="gl"></canvas>
  <div id="titles" aria-hidden="true"></div>

  <div id="loader">Chargement de la scène 3D…</div>

  <div id="start">
    <svg class="start-mark" viewBox="-0.36 -0.52 0.72 1.04" aria-hidden="true"><!--LOGO_SVG--></svg>
    <h1 class="start-title">Kizzo</h1>
    <p class="start-sub">Le temps d’écran se gagne en apprenant.</p>
    <button class="btn-start" id="btn-start-play" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
      Lancer avec le son
    </button>
    <p class="start-meta">36 s · 1080 × 1920 · 60 fps</p>
  </div>

  <div id="controls">
    <button class="ctl" id="btn-play" type="button" aria-label="Lecture / pause">
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
    </button>
    <button class="ctl" id="btn-replay" type="button" aria-label="Rejouer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V9h4.5"/></svg>
    </button>
    <div id="bar" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="30" tabindex="0"><div id="bar-fill"></div></div>
    <span id="time">00:00 / 00:30</span>
    <button class="ctl" id="btn-mute" type="button" aria-label="Son">
      <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.6 6.4a7.6 7.6 0 0 1 0 11.2"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
    </button>
    <button class="ctl" id="btn-full" type="button" aria-label="Plein écran">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</main>
<script>/*APP*/</script>
<!--BODY_CLOSE--></body>
</html><!--DOC_END-->
