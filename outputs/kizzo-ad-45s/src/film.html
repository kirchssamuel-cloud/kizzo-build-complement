<!--HEAD-->
<title>Kizzo Pub 45s</title>
<style>
/*FONTS*/
/* Vertical 9:16 stage on a dark viewer; the ad itself lives in the app's pastel world. */
:root {
  --viewer: #0B1620;
  --ink: #0c2937;
  --navy: #071b39;
  --cyan: #2bbbed;
  --cyan-text: #1590c9;
  --orange: #ff7a1b;
  --orange-text: #e8620f;
  --cta: #ee6a2c;
  --cream: #fffcf7;
  --mute: #9fb3bf;
  --display: 'Outfit', 'Avenir Next', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--viewer); color: var(--cream); overflow: hidden; font-family: var(--display); }
#viewport { position: fixed; inset: 0; padding-inline: 16px; background: var(--viewer); cursor: pointer; -webkit-tap-highlight-color: transparent; }
#stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 50% 50%; overflow: hidden; background: #dadbd3; contain: strict; -webkit-user-select: none; user-select: none; border-radius: 0; }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

/* on-screen copy */
.plate { position: absolute; left: 510px; visibility: hidden; padding: 26px 40px 30px; border-radius: 32px; background: rgba(255, 252, 247, 0.8); -webkit-backdrop-filter: blur(18px) saturate(1.15); backdrop-filter: blur(18px) saturate(1.15); box-shadow: 0 18px 50px rgba(12, 41, 55, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9); color: var(--ink); font: 800 64px/1.1 var(--display); letter-spacing: -0.012em; text-align: center; white-space: nowrap; will-change: transform, opacity; }
.plate.small { font-size: 50px; padding: 20px 32px 24px; border-radius: 26px; }
.pl-line { display: block; }
.w { display: inline-block; will-change: transform, opacity; }
.acc-orange { color: var(--orange-text); }
.acc-cyan { color: var(--cyan-text); }

/* exact logo on its own navy ground */
.logo-card { position: absolute; visibility: hidden; background: var(--navy); border-radius: 40px; box-shadow: 0 30px 80px rgba(7, 27, 57, 0.32); }
.logo-card.fly { width: 300px; height: 379px; border-radius: 30px; }
.logo-card.end { left: 540px; top: 360px; width: 470px; height: 594px; margin-left: -235px; transform-origin: 50% 50%; }
.logo-stack { position: absolute; left: 7%; top: 7%; width: 86%; height: 86%; }
.lg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; display: block; }
.endcard { position: absolute; inset: 0; visibility: hidden; }
.endcard .logo-card { visibility: inherit; }
.tagline { position: absolute; left: 0; right: 0; top: 1010px; text-align: center; color: var(--ink); font: 800 66px/1.12 var(--display); letter-spacing: -0.015em; }
.tl { will-change: transform, opacity; }
.cta { position: absolute; left: 540px; top: 1222px; width: 580px; height: 116px; margin-left: -290px; display: grid; place-items: center; overflow: hidden; border-radius: 34px; background: var(--cta); color: #fff; font: 700 48px/1 var(--display); letter-spacing: -0.005em; box-shadow: 0 22px 50px rgba(238, 106, 44, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35); transform-origin: 50% 50%; }
.cta-shine { position: absolute; left: 0; top: -20%; width: 90px; height: 140%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0)); opacity: 0; }
.outro-dot { position: absolute; left: 546.8px; top: 538.5px; width: 77.6px; height: 77.6px; border-radius: 50%; background: var(--orange); visibility: hidden; box-shadow: 0 10px 30px rgba(255, 122, 27, 0.35); }

/* preview helpers */
.safe { position: absolute; inset: 0; pointer-events: none; display: none; }
body.guides .safe { display: block; }
.safe i { position: absolute; background: repeating-linear-gradient(45deg, rgba(255, 60, 60, 0.18) 0 12px, rgba(255, 60, 60, 0.06) 12px 24px); outline: 2px dashed rgba(255, 60, 60, 0.6); }
.safe .lbl { position: absolute; left: 24px; top: 150px; font: 600 26px var(--display); color: #ff5050; }
.grain { position: absolute; inset: -64px; pointer-events: none; opacity: 0.05; mix-blend-mode: overlay; }

/* player chrome */
#controls { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(760px, calc(100% - 32px)); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 8px 14px 8px 8px; border-radius: 20px; background: rgba(11, 22, 32, 0.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); opacity: 0; transition: opacity 0.35s ease; cursor: default; }
#controls.show, body:not(.playing).ready #controls { opacity: 1; }
#controls button { flex: none; height: 40px; min-width: 40px; padding: 0 10px; border-radius: 14px; border: 0; display: grid; place-items: center; color: #fff; background: rgba(255, 255, 255, 0.08); cursor: pointer; font: 600 13px var(--display); }
#controls button:hover { background: rgba(255, 255, 255, 0.16); }
#controls button:focus-visible, #scrub:focus-visible + .track { outline: 2px solid var(--orange); outline-offset: 2px; }
#controls button[aria-pressed='true'] { background: rgba(43, 187, 237, 0.3); }
#btn-play[data-state='play'] .i-pause, #btn-play[data-state='pause'] .i-play { display: none; }
#btn-replay { display: none !important; }
body.ended #btn-replay { display: grid !important; background: var(--cta); }
body.ended #btn-play { display: none; }
.scrub { position: relative; flex: 1 1 200px; min-width: 0; height: 28px; display: flex; align-items: center; }
.scrub .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; pointer-events: none; }
#scrub-fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--cyan), var(--orange)); transform-origin: 0 50%; transform: scaleX(0); }
#scrub { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
#time { flex: none; font: 500 12px var(--display); font-variant-numeric: tabular-nums; color: var(--mute); white-space: nowrap; }
.chapters { display: flex; gap: 6px; flex-wrap: wrap; }
.chapters button { min-width: 34px !important; height: 30px !important; padding: 0 8px !important; border-radius: 10px !important; font-size: 12px !important; }
@media (max-width: 520px) { #time { display: none; } }
@media (prefers-reduced-motion: reduce) { #controls { transition: none; } }
</style>
<!--BODY-->
<div id="viewport">
  <div id="stage" aria-label="Publicité Kizzo, 45 secondes, format vertical">
    <canvas id="gl" width="1080" height="1920"></canvas>
    <div class="grain" id="grain"></div>
    <div class="safe" aria-hidden="true"><i style="left:0;top:0;width:1080px;height:220px"></i><i style="left:0;top:1500px;width:1080px;height:420px"></i><i style="left:960px;top:880px;width:120px;height:620px"></i><span class="lbl">Zones masquées par les plateformes</span></div>
  </div>
  <div id="controls" class="show">
    <button id="btn-play" type="button" data-state="play" aria-label="Lecture">
      <svg class="i-play" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.6v10.8c0 .8.9 1.3 1.6.8l8.3-5.4c.6-.4.6-1.2 0-1.6L5.6 1.8C4.9 1.3 4 1.8 4 2.6z" fill="currentColor"/></svg>
      <svg class="i-pause" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1.4" fill="currentColor"/><rect x="9.4" y="2" width="3.6" height="12" rx="1.4" fill="currentColor"/></svg>
    </button>
    <button id="btn-replay" type="button" aria-label="Rejouer">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3.2V1L5.4 4 9 7V4.8a4.6 4.6 0 1 1-4.6 4.6H2.8A6.2 6.2 0 1 0 9 3.2z" fill="currentColor"/></svg>
    </button>
    <label class="scrub" for="scrub">
      <input id="scrub" type="range" min="0" max="4500" step="1" value="0" aria-label="Position dans la vidéo">
      <span class="track"><span id="scrub-fill"></span></span>
    </label>
    <span id="time">00:00 / 00:45</span>
    <div class="chapters" role="group" aria-label="Séquences">
      <button type="button" data-t="0" title="Le hook">1</button>
      <button type="button" data-t="5.6" title="La découverte">2</button>
      <button type="button" data-t="11.7" title="Une photo de la leçon">3</button>
      <button type="button" data-t="18.8" title="La leçon devient un quiz">4</button>
      <button type="button" data-t="26.8" title="Le bon rythme">5</button>
      <button type="button" data-t="31.7" title="Le bénéfice familial">6</button>
      <button type="button" data-t="38.6" title="Signature">7</button>
    </div>
    <button id="btn-guides" type="button" aria-pressed="false" title="Afficher les zones sûres (G)">Zones sûres</button>
  </div>
</div>
<script>/*SCRIPT*/</script>
